<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- SECTION 6: Fotogalerie-->
<section id="page-galerie" class="page-content">
    <div class="container">
        <div class="section-header">
            <h2>Fotogalerie</h2>
            <div class="section-divider"></div>
        </div>

        Album Grid
        <div class="album-grid" id="album-grid">

            Album: Sezona 2026
            <div class="album-card" data-album="sezona_26">
                <div class="album-cover">
                    <img src="assets/sezona_26/marsov_26.jpg" alt="Sezóna 2026" >
                    <div class="album-overlay">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                </div>
                <div class="album-info">
                    <span class="album-title">Závodní sezóna 2026</span>
                </div>
            </div>

            Album: Oslavy muzea
            <div class="album-card" data-album="muzeum">
                <div class="album-cover">
                    <img src="assets/oslavy_muzeum/oslavy_muzeum.jpg" alt="Oslavy 25 let muzea">
                    <div class="album-overlay">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                </div>
                <div class="album-info">
                    <span class="album-title">Oslavy 25 let muzea</span>
                </div>
            </div>

            Album: Hasicsky ples
            <div class="album-card" data-album="ples">
                <div class="album-cover">
                    <img src="assets/ples_26/ples.jpg" alt="Hasičský ples 2026">
                    <div class="album-overlay">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                </div>
                <div class="album-info">
                    <span class="album-title">Hasičský ples 2026</span>
                </div>
            </div>

            Album: Krouzek
            <div class="album-card" data-album="krouzek">
                <div class="album-cover">
                    <img src="assets/krouzek/deti.jpg" alt="Mladi hasici na zavodech">
                    <div class="album-overlay">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                </div>
                <div class="album-info">
                    <span class="album-title">Kroužek mladých hasičů</span>
                </div>
            </div>

            Album: Technika
            <div class="album-card" data-album="technika">
                <div class="album-cover">
                    <img src="assets/technika/da_ford.jpg" alt="Technika sboru">
                    <div class="album-overlay">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                </div>
                <div class="album-info">
                    <span class="album-title">Technika sboru</span>
                </div>
            </div>

            Album: Historie
            <div class="album-card" data-album="historie">
                <div class="album-cover">
                    <img src="assets/historie/historie1.jpg" alt="Historie" >
                    <div class="album-overlay">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                </div>
                <div class="album-info">
                    <span class="album-title">Momenty z historie</span>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- Album Lightbox -->
<div id="album-lightbox" class="album-lightbox" role="dialog" aria-modal="true">
    <div class="album-lightbox-inner">
        <button class="album-lb-close" id="album-lb-close" aria-label="Zavřít">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 class="album-lb-title" id="album-lb-title"></h3>
        <div class="album-lb-stage">
            <button class="album-lb-arrow album-lb-prev" id="album-lb-prev" aria-label="Předchozí">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="album-lb-img-wrap">
                <img id="album-lb-img" src="" alt="">
            </div>
            <button class="album-lb-arrow album-lb-next" id="album-lb-next" aria-label="Další">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
        <div class="album-lb-counter" id="album-lb-counter">1 / 1</div>
    </div>
</div>

</body>
</html>
